[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ventoy-iso-updater"
version = "1.2.0"
description = "GUI to manage Ventoy USB keys: check for ISO updates, download, and manage themes"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "customtkinter>=6.0.0,<7.0.0",
    "Pillow>=13.0.0,<14.0.0",
    "requests>=2.33.0,<3.0.0",
    "packaging>=23.0,<27.0",
]

[project.scripts]
ventoy-iso-updater = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "gui*", "sources*"]

[tool.setuptools.package-data]
"*" = ["data/*.json", "assets/**/*"]
